<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("jobtracker-theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (error) { /* Keep the accessible light default. */ }
    }());
  </script>
  <title>{% block title %}JobTracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.home') }}" aria-label="JobTracker home">
      <span class="brand-mark" aria-hidden="true">JT</span>
      <span>JobTracker</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ url_for('main.home') }}">Dashboard</a>
      <a href="{{ url_for('applications.index') }}">Applications</a>
      <a href="{{ url_for('resumes.index') }}">Resumes</a>
      <a href="{{ url_for('reminders.index') }}">Reminders</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">Theme</button>
    </nav>
  </header>
  <main id="main-content" class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flash-stack" aria-live="polite">{% for category, message in messages %}<p class="flash flash-{{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
